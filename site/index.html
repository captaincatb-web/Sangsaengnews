<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>협력사 프로필</title>
  <meta name="description" content="반도체 협력 지정 기업 64곳의 매출, 이익, 주가를 금융감독원 전자공시(DART) 기준으로 한눈에 정리했습니다.">
  <link rel="icon" href="data:,">
  <link rel="preload" href="vendor/pretendard/PretendardVariable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="vendor/phosphor/style.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#companies">기업 표로 건너뛰기</a>

  <header class="site-head">
    <div class="wrap wrap-wide">
      <a class="brand" href="./"><span class="brand-mark" aria-hidden="true">협</span>협력사 프로필</a>
    </div>
  </header>

  <main class="wrap wrap-wide">
    <section class="intro" aria-labelledby="title">
      <h1 id="title">반도체 협력 기업 <span id="total">64</span>곳을 한눈에</h1>
      <p class="lead">기업별 매출, 이익, 주가를 금융감독원 전자공시(DART) 기준으로 정리했습니다.</p>
      <ul class="meta" id="summary"></ul>
    </section>

    <section aria-label="기업 표">
      <div class="controls">
        <div class="search">
          <label class="sr-only" for="search">기업명, 종목코드, 고유번호 검색</label>
          <i class="ph ph-magnifying-glass" aria-hidden="true"></i>
          <input id="search" type="search" placeholder="기업명, 종목코드, 고유번호 검색" autocomplete="off" spellcheck="false">
        </div>
        <div class="segmented" role="radiogroup" aria-label="그룹" id="group-filter"></div>
        <label class="switch">
          <input type="checkbox" id="listed-only">
          <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
          상장사만
        </label>
        <button class="btn" type="button" id="copy-table"><i class="ph ph-copy" aria-hidden="true"></i>표 복사</button>
      </div>

      <p class="table-note" id="table-note"></p>
      <p class="sr-only" id="result-count" aria-live="polite"></p>

      <div class="table-wrap">
        <table class="data" id="companies">
          <thead><tr id="table-head"></tr></thead>
        </table>
      </div>

      <div class="empty" id="empty" hidden>
        <p class="empty-title">조건에 맞는 기업이 없습니다</p>
        <p>검색어를 줄이거나 그룹을 전체로 바꿔 보세요.</p>
        <button class="btn" type="button" id="reset-filters">필터 초기화</button>
      </div>
    </section>
  </main>

  <footer class="site-foot">
    <div class="wrap wrap-wide foot-inner">
      <p>자료: 금융감독원 전자공시(DART) 사업보고서·감사보고서, 주가 Yahoo Finance</p>
      <p>매일 오전 7시 30분 자동 갱신</p>
    </div>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="data/companies.js"></script>
  <script src="data/profiles.js"></script>
  <script src="copy.js"></script>
  <script src="app.js"></script>
</body>
</html>
