<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>2027 팀 아이디어 워크숍 | 3인 의견 수렴</title>
  <style>
    :root { --bg:#f6f7f8; --paper:#fff; --ink:#152235; --muted:#697789; --line:#e4e8ee; --blue:#274f99; --blue-dark:#1d3b73; --soft-blue:#eaf0fa; --green:#13786a; --soft-green:#e9f6f1; --orange:#a96b29; --soft-orange:#fff4e5; --nav:#172437; --nav-light:#22354e; --shadow:0 8px 24px rgba(20,39,60,.045); --round:15px; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif; color:var(--ink); background:var(--bg); -webkit-font-smoothing:antialiased; }
    button, input, textarea, select { font:inherit; }
    button { cursor:pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible { outline:3px solid #7aa4e7; outline-offset:2px; }
    .app { display:grid; grid-template-columns:250px minmax(0,1fr); min-height:100vh; }
    .sidebar { background:var(--nav); color:#e9eef7; display:flex; flex-direction:column; position:sticky; top:0; height:100vh; padding:28px 16px 21px; }
    .brand { display:flex; align-items:center; gap:12px; margin:0 12px 34px; }
    .brandmark { width:38px; height:38px; display:grid; place-items:center; border-radius:11px; background:#7da4f1; color:#10254d; font-weight:900; font-size:20px; letter-spacing:-3px; padding-right:3px; }
    .brand-title { font-size:15px; font-weight:850; line-height:1.4; letter-spacing:-.3px; }
    .brand-sub { color:#98abc5; letter-spacing:1px; font-size:10px; font-weight:700; margin-top:2px; }
    .nav-label { color:#879bb4; margin:0 13px 13px; font-size:11px; font-weight:800; letter-spacing:1.3px; }
    .nav { display:flex; flex-direction:column; gap:5px; }
    .nav button { width:100%; display:flex; align-items:center; justify-content:space-between; gap:8px; border:none; background:transparent; color:#cad7e9; text-align:left; border-radius:10px; padding:13px 14px; font-size:13px; font-weight:650; }
    .nav button:hover { background:#23354c; }
    .nav button.active { background:#314a70; color:#fff; }
    .nav-label-inner { display:flex; align-items:center; gap:10px; }
    .nav-number { color:#8ca4c1; font-size:11px; min-width:17px; }
    .nav button.active .nav-number { color:#b9d4ff; }
    .nav-count { font-size:11px; color:#d6e4fa; background:#30425c; border-radius:7px; padding:3px 7px; }
    .sidebar-note { margin-top:auto; border:1px solid #34465b; border-radius:12px; padding:15px 13px; background:rgba(255,255,255,.03); }
    .sidebar-note strong { font-size:12px; display:block; }
    .sidebar-note p { font-size:11px; line-height:1.75; color:#a8bbd3; margin:7px 0 0; }
    .main { min-width:0; width:100%; }
    .topbar { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:18px clamp(22px,4.3vw,60px); background:var(--paper); border-bottom:1px solid var(--line); }
    .breadcrumb { font-size:12px; color:var(--muted); font-weight:650; }
    .breadcrumb b { color:#2a456f; font-weight:850; }
    .topright { display:flex; align-items:center; gap:10px; }
    .saved { display:flex; align-items:center; gap:7px; color:#3c7c66; font-size:11px; white-space:nowrap; }
    .dot { display:inline-block; width:7px; height:7px; border-radius:50%; background:#38a47b; }
    .participant-select { background:#fff; color:var(--ink); border:1px solid #d5dfe9; border-radius:9px; padding:9px 30px 9px 12px; max-width:180px; font-size:12px; font-weight:750; }
    .content { max-width:1220px; padding:36px clamp(22px,4.3vw,60px) 70px; margin:auto; }
    .eyebrow { font-size:11px; font-weight:900; letter-spacing:1.5px; color:var(--blue); text-transform:uppercase; margin:0 0 12px; }
    h1 { font-size:clamp(25px,3vw,34px); letter-spacing:-1.7px; line-height:1.24; margin:0; font-weight:850; }
    h2 { font-size:19px; letter-spacing:-.7px; margin:0; font-weight:850; }
    h3 { font-size:15px; letter-spacing:-.35px; margin:0; font-weight:850; }
    p { margin-top:0; }
    .lead { color:var(--muted); font-size:13px; line-height:1.8; margin:12px 0 0; }
    .view-head { display:flex; align-items:flex-start; justify-content:space-between; gap:22px; margin-bottom:28px; }
    .view-head .head-actions { padding-top:7px; white-space:nowrap; display:flex; gap:8px; }
    .hero { background:linear-gradient(115deg,#203c68,#294f87); color:#fff; border-radius:18px; display:flex; align-items:center; justify-content:space-between; padding:30px 34px; min-height:170px; margin-bottom:20px; overflow:hidden; position:relative; }
    .hero::after { content:""; position:absolute; width:290px; height:290px; border:1px solid rgba(255,255,255,.13); border-radius:50%; right:-60px; top:-100px; box-shadow:0 0 0 42px rgba(255,255,255,.03),0 0 0 94px rgba(255,255,255,.025); }
    .hero strong { font-size:22px; letter-spacing:-.8px; display:block; position:relative; z-index:1; }
    .hero p { color:#d3e0f6; line-height:1.75; font-size:12px; margin:11px 0 0; position:relative; z-index:1; }
    .hero-side { flex:0 0 112px; text-align:center; position:relative; z-index:1; }
    .hero-side .big { font-size:39px; font-weight:900; letter-spacing:-2px; }
    .hero-side .small { font-size:11px; color:#d6e6fc; }
    .grid-metrics { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:15px; margin-bottom:26px; }
    .metric { border-radius:var(--round); background:var(--paper); border:1px solid var(--line); padding:21px 23px; box-shadow:var(--shadow); }
    .metric-top { display:flex; justify-content:space-between; gap:8px; color:var(--muted); font-size:12px; font-weight:700; align-items:center; }
    .metric-icon { color:var(--blue); background:var(--soft-blue); border-radius:8px; width:29px; height:29px; display:grid; place-items:center; font-weight:850; }
    .metric-number { font-weight:850; font-size:30px; margin:12px 0 2px; letter-spacing:-1px; }
    .metric-number small { font-size:13px; color:#7d8c9c; font-weight:650; }
    .metric-desc { font-size:11px; color:var(--muted); }
    .two-col { display:grid; grid-template-columns:1.24fr 1fr; gap:17px; }
    .panel { background:var(--paper); border:1px solid var(--line); border-radius:var(--round); box-shadow:var(--shadow); padding:24px; min-width:0; margin-bottom:18px; }
    .panel-title-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; gap:10px; }
    .section-note { font-size:11px; color:var(--muted); line-height:1.6; }
    .tag { display:inline-flex; font-size:10px; font-weight:750; border-radius:6px; padding:5px 8px; background:#edf1f6; color:#526276; white-space:nowrap; }
    .tag.green { color:var(--green); background:var(--soft-green); }
    .tag.orange { color:var(--orange); background:var(--soft-orange); }
    .tag.blue { color:var(--blue); background:var(--soft-blue); }
    .person-row { display:grid; grid-template-columns:36px minmax(85px,1fr) auto; gap:12px; align-items:center; padding:11px 0; border-bottom:1px solid #eff1f4; }
    .person-row:last-child { border-bottom:none; }
    .avatar { width:35px; height:35px; border-radius:10px; display:grid; place-items:center; font-size:12px; font-weight:850; background:#e6edf8; color:#385a91; flex:0 0 auto; }
    .person-row strong { font-size:12px; }
    .person-row small { display:block; font-size:11px; color:var(--muted); margin-top:4px; }
    .numlist { display:flex; flex-direction:column; gap:15px; }
    .numlist > div { display:flex; gap:12px; }
    .stepnum { background:#edf2f9; color:#40649b; border-radius:8px; font-weight:850; width:27px; height:27px; flex:0 0 27px; display:grid; place-items:center; font-size:11px; }
    .numlist strong { font-size:12px; display:block; padding-top:1px; }
    .numlist p { color:var(--muted); font-size:11px; line-height:1.6; margin:4px 0 0; }
    .btn { border:1px solid #d8e0ea; background:#fff; color:#33465f; border-radius:9px; padding:10px 13px; font-size:12px; font-weight:750; display:inline-flex; gap:7px; align-items:center; justify-content:center; min-height:37px; }
    .btn:hover { border-color:#9ab0d5; background:#f7f9fd; }
    .btn.primary { color:#fff; border-color:var(--blue); background:var(--blue); }
    .btn.primary:hover { background:var(--blue-dark); }
    .btn.danger { color:#b84444; }
    .btn.ghost { border-color:transparent; background:transparent; }
    .btn.mini { font-size:11px; padding:7px 10px; min-height:30px; }
    .btn:disabled { opacity:.45; cursor:not-allowed; }
    .subtle-link { color:var(--blue); font-size:11px; font-weight:800; border:0; padding:6px 0; background:none; }
    .notice { background:#f0f5fb; border:1px solid #dce7f7; border-radius:11px; padding:14px 16px; font-size:12px; color:#496381; line-height:1.75; margin:16px 0 21px; }
    .notice strong { color:#2d4d82; }
    .notice.warm { background:#fff8ed; border-color:#f4e5ca; color:#83623b; }
    .divider { border:none; border-top:1px solid var(--line); margin:20px 0; }
    .name-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; }
    .field { display:flex; flex-direction:column; gap:8px; min-width:0; }
    label { font-weight:800; font-size:12px; color:#273950; }
    input[type="text"], textarea { display:block; width:100%; padding:12px 13px; background:#fff; color:var(--ink); border:1px solid #d8e1ec; border-radius:9px; font-size:12px; outline:none; line-height:1.7; }
    input[type="text"]:focus, textarea:focus { border-color:#779ad1; box-shadow:0 0 0 3px rgba(83,128,203,.11); }
    textarea { min-height:120px; resize:vertical; }
    input::placeholder, textarea::placeholder { color:#9aa6b4; }
    .hint { font-size:11px; color:#8491a2; font-weight:500; line-height:1.55; }
    .review-card { background:var(--paper); border:1px solid var(--line); border-radius:var(--round); padding:25px 26px; margin-bottom:15px; box-shadow:var(--shadow); }
    .review-card .review-icon { font-size:11px; color:var(--blue); background:var(--soft-blue); font-weight:900; border-radius:7px; padding:7px 9px; display:inline-block; margin-bottom:13px; }
    .review-card .review-icon.green { color:var(--green); background:var(--soft-green); }
    .review-card h3 { font-size:16px; margin-bottom:8px; }
    .review-card p { font-size:12px; color:var(--muted); line-height:1.7; margin:0 0 16px; }
    .review-card textarea { min-height:145px; }
    .review-tools { display:flex; align-items:center; justify-content:space-between; margin-top:9px; gap:10px; font-size:11px; color:var(--muted); }
    .idea-layout { display:grid; grid-template-columns:minmax(0,1.1fr) minmax(280px,.9fr); gap:18px; align-items:start; }
    .idea-fields { display:grid; gap:16px; }
    .idea-fields textarea { min-height:100px; }
    .five-criteria {display:flex;flex-direction:column;gap:15px}
    .criteria-card {background:#f8fafc;border:1px solid #e1e7f0;border-radius:11px;padding:15px 16px}
    .criteria-title {display:flex;gap:9px;align-items:center;font-size:13px;font-weight:800;margin:0 0 8px}
    .criteria-num {display:inline-flex;align-items:center;justify-content:center;flex:0 0 26px;height:26px;border-radius:7px;background:#e7effb;color:#234d8d;font-size:12px}
    .criteria-card textarea {min-height:82px;background:#fff}
    .criteria-card select {width:100%}
    .criteria-subgrid {display:grid;grid-template-columns:1fr 1fr;gap:9px}
    .criteria-recap {background:#f8fafc;border:1px solid #edf0f3;border-radius:9px;padding:11px 13px;margin:9px 0;color:#45576f;font-size:12px;line-height:1.75}
    .criteria-recap b {display:block;margin-bottom:3px;color:#24364e}
    .cloud-auth {position:fixed;inset:0;z-index:99;background:rgba(10,26,50,.64);display:flex;align-items:center;justify-content:center;padding:20px}
    .cloud-auth[hidden] {display:none}
    .cloud-auth-inner {background:white;border-radius:16px;padding:30px;max-width:440px;width:100%;box-shadow:0 16px 50px rgba(0,0,0,.2)}
    .cloud-auth-inner h2 {font-size:21px;margin:0 0 10px}
    .cloud-auth-inner p {color:#596a80;line-height:1.7;font-size:13px}
    .cloud-auth-inner input {padding:13px;border:1px solid #cbd5e1;border-radius:9px;width:100%;margin:8px 0 12px}
    .cloud-auth-inner .btn {width:100%;margin-bottom:8px}
    .cloud-setup {padding:14px 16px;background:#f1f5fa;border:1px solid #d8e2ee;border-radius:10px;margin:14px 0;font-size:12px;color:#4a5870;line-height:1.7}
    @media (max-width:680px){.criteria-subgrid{grid-template-columns:1fr}}

    .form-actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:3px; }
    .idea-list { display:flex; flex-direction:column; gap:13px; }
    .idea-card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:19px 20px; box-shadow:var(--shadow); }
    .idea-card.selected { border-color:#a5d5c8; background:linear-gradient(120deg,#fff,#f8fdfb); }
    .idea-card-top { display:flex; gap:10px; justify-content:space-between; align-items:flex-start; }
    .idea-card h3 { overflow-wrap:anywhere; line-height:1.55; font-size:14px; }
    .idea-meta { display:flex; flex-wrap:wrap; align-items:center; gap:7px; margin:9px 0 12px; color:#7f8b9b; font-size:10px; }
    .idea-body { white-space:pre-wrap; overflow-wrap:anywhere; line-height:1.75; font-size:12px; color:#526275; margin:0 0 11px; }
    .impact { border-left:2px solid #d9e3ef; padding:7px 0 7px 10px; font-size:11px; color:#5b7089; margin:8px 0; white-space:pre-wrap; overflow-wrap:anywhere; }
    .idea-bottom { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px; border-top:1px solid #ecf0f4; margin-top:16px; padding-top:14px; }
    .idea-bottom-actions { display:flex; gap:6px; flex-wrap:wrap; }
    .vote-btn { border:1px solid #d8e4f3; background:#f4f7fc; color:#4e688e; border-radius:8px; padding:8px 10px; font-size:11px; font-weight:800; }
    .vote-btn.voted { background:#e7efff; border-color:#9bb8f5; color:#284f92; }
    .candidate-btn { background:#fff; border:1px solid #d9e5e2; color:#287b6e; border-radius:8px; padding:8px 10px; font-size:11px; font-weight:800; }
    .candidate-btn.on { background:#e1f4ed; border-color:#9acdbd; }
    .empty { display:grid; place-items:center; text-align:center; padding:47px 16px; border:1px dashed #cbd5e1; border-radius:12px; background:#fbfcfe; }
    .empty-symbol { width:46px; height:46px; display:grid; place-items:center; background:#ecf2fb; border-radius:13px; font-size:24px; color:#5979a8; font-weight:700; }
    .empty strong { font-size:13px; margin-top:15px; }
    .empty p { color:var(--muted); margin:7px 0 0; font-size:11px; line-height:1.7; }
    .list-header { display:flex; gap:12px; align-items:center; flex-wrap:wrap; justify-content:space-between; margin-bottom:14px; }
    .filter-buttons { display:flex; border-radius:9px; background:#edf1f6; padding:3px; gap:2px; }
    .filter-buttons button { border:none; background:transparent; color:#708197; padding:8px 10px; border-radius:7px; font-size:11px; font-weight:800; }
    .filter-buttons button.active { background:#fff; color:#284671; box-shadow:0 2px 5px rgba(27,51,82,.07); }
    .summary-block { background:#fff; border:1px solid var(--line); border-radius:var(--round); margin-bottom:17px; padding:24px 26px; }
    .summary-section-head { display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:17px; }
    .summary-item { border-top:1px solid #edf0f4; padding:15px 0; }
    .summary-item:first-child { border-top:none; padding-top:0; }
    .summary-item:last-child { padding-bottom:0; }
    .summary-item-title { font-weight:800; font-size:12px; margin-bottom:9px; }
    .summary-pair { display:grid; grid-template-columns:60px 1fr; gap:11px; margin:6px 0; }
    .summary-pair .k { font-size:11px; font-weight:800; color:#5980ae; }
    .summary-pair .v { font-size:12px; color:#4d5e70; line-height:1.8; overflow-wrap:anywhere; white-space:pre-wrap; }
    .summary-idea { border-top:1px solid #edf0f4; padding:15px 0; }
    .summary-idea:first-child { border-top:0; padding-top:0; }
    .summary-idea:last-child { padding-bottom:0; }
    .summary-idea strong { display:block; font-size:13px; margin-bottom:6px; }
    .summary-idea p { font-size:12px; color:#526479; line-height:1.8; white-space:pre-wrap; overflow-wrap:anywhere; margin:7px 0; }
    .summary-badges { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
    .footer { margin-top:38px; color:#94a0ae; font-size:11px; text-align:center; line-height:1.8; }
    .toast { position:fixed; bottom:23px; right:25px; padding:12px 17px; background:#223752; color:#fff; font-size:12px; border-radius:10px; box-shadow:0 10px 28px rgba(0,0,0,.18); opacity:0; transform:translateY(9px); transition:opacity .2s,transform .2s; pointer-events:none; z-index:30; max-width:calc(100vw - 36px); }
    .toast.show { opacity:1; transform:translateY(0); }
    .warning-note { font-size:11px; color:#88765a; padding:12px 14px; background:#fff9f1; border:1px solid #f0e6d6; border-radius:9px; line-height:1.7; }
    @media (max-width:1050px) { .app { grid-template-columns:205px minmax(0,1fr); } .sidebar { padding:24px 10px; } .idea-layout { grid-template-columns:1fr; } .two-col { grid-template-columns:1fr; } }
    @media (max-width:680px) { .app { display:block; } .sidebar { height:auto; padding:14px 14px 10px; position:static; } .brand { margin:0 5px 13px; } .nav-label,.sidebar-note { display:none; } .nav { display:flex; flex-direction:row; gap:4px; overflow-x:auto; padding-bottom:3px; } .nav button { flex:0 0 auto; padding:10px 11px; width:auto; } .nav-count,.nav-number { display:none; } .nav-label-inner { gap:0; } .topbar { padding:13px 16px; flex-wrap:wrap; } .content { padding:27px 16px 50px; } .view-head { display:block; } .view-head .head-actions { margin-top:14px; flex-wrap:wrap; } .grid-metrics { gap:8px; } .metric { padding:15px 12px; } .metric-top { font-size:10px; } .metric-icon { display:none; } .metric-number { font-size:26px; } .metric-desc { font-size:10px; } .hero { padding:25px 21px; } .hero-side { flex-basis:74px; } .hero-side .big { font-size:30px; } .hero strong { font-size:19px; } .hero p { font-size:11px; } .panel,.review-card,.summary-block { padding:19px 17px; } .name-grid { grid-template-columns:1fr; } .saved { display:none; } .participant-select { max-width:150px; } }
    @media print { @page { size:A4; margin:14mm; } body { color:#111; background:white; } .app { display:block; } .sidebar,.topbar,.view-head .head-actions,.footer,.no-print,.toast { display:none!important; } .content { max-width:none; padding:0; } .view-head { margin-bottom:14px; } h1 { font-size:24px; } .summary-block { break-inside:avoid; padding:18px 0; border:none; border-top:1px solid #bbb; border-radius:0; margin:0; } .summary-idea,.summary-item { break-inside:avoid; } .summary-section-head { margin-bottom:11px; } .notice { display:none; } }
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="brandmark">···</div><div><div class="brand-title">팀 아이디어 워크숍</div><div class="brand-sub">2027 PLANNING ROOM</div></div></div>
    <div class="nav-label">WORKSPACE</div>
    <nav class="nav" id="nav" aria-label="화면 이동"></nav>
    <div class="sidebar-note"><strong>3명이 함께 만드는 2027년</strong><p>각자 업무 Review를 작성하고,<br>조별 아이디어를 모아 최종안을 정리하세요.</p></div>
  </aside>
  <div class="main">
    <div class="topbar"><div class="breadcrumb">TEAM WORKSHOP <span style="color:#c7cdd6;margin:0 7px">/</span> <b id="crumb">전체 현황</b></div><div class="topright"><div class="saved" id="save-status"><span class="dot"></span> 이 브라우저에 자동 저장</div><label for="participant" style="font-size:11px;color:#7b899a">작성자</label><select class="participant-select" id="participant" aria-label="현재 작성자"></select></div></div>
    <main class="content" id="content"></main>
  </div>
</div>
<input type="file" id="import-file" accept=".json,application/json" hidden>
<div class="toast" role="status" aria-live="polite" id="toast"></div>
<div id="cloud-auth" class="cloud-auth" hidden><div class="cloud-auth-inner"><h2>워크숍 참여자 로그인</h2><p>3명의 등록된 이메일로만 공유 자료에 접근할 수 있습니다. 이메일로 전송된 로그인 링크를 열어주세요.</p><form id="cloud-login"><label for="cloud-email">이메일 주소</label><input id="cloud-email" type="email" autocomplete="email" required placeholder="name@example.com"><button class="btn primary" type="submit">이메일 로그인 링크 받기</button></form><p id="cloud-message"></p><p class="hint">회사 정보보호 정책에 따라 외부 서비스 사용이 허용된 자료만 입력하세요.</p></div></div>
<script src="./config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
(() => {
  'use strict';
  const KEY = 'team_workshop_2027_v1';
  const ACTIVE_KEY = KEY + '_active';
  const labels = {dashboard:'전체 현황',review:'2026 업무 Review',improve:'2027 업무 개선',newbiz:'2027 신규사업',summary:'최종 취합'};
  const order = ['dashboard','review','improve','newbiz','summary'];
  const stateFactory = () => ({version:1,updatedAt:0,participants:[1,2,3].map(n=>({id:'p'+n,name:'참석자 '+n,nameUpdatedAt:0,review:{problem:'',success:'',problemUpdatedAt:0,successUpdatedAt:0}})),ideas:[],deletedIds:[]});
  let state = loadState();
  let active = localStorage.getItem(ACTIVE_KEY) || 'p1';
  let view = 'dashboard';
  let editing = null;
  let ideaFilters = {improve:'all',newbiz:'all'};
  let timer = null;
  const cloud = {client:null,connected:false,revision:0,writing:false,pending:false,delay:null,personId:null,lastRemoteLoad:0};
  const fieldsBiz = [
    ['need','① 왜 필요한지'],['benefitCompany','② 당사에 도움이 되는지'],['benefitSupplier','② 협력사에 도움이 되는지'],
    ['feasibilityReason','③ 실행 가능성의 근거'],['execution','④ 어떻게 실행할 것인지'],['change','⑤ 실행하면 무엇이 달라지는지']
  ];
  if (!state.participants.some(p=>p.id===active)) active='p1';
  const $ = s => document.querySelector(s);
  const esc = v => String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const nl = v => String(v??'').trim() || '미작성';
  const person = id => state.participants.find(p=>p.id===id);
  const authorName = id => person(id)?.name || '작성자';
  const now = () => Date.now();
  const reviewDone = p => Boolean(p.review.problem.trim() && p.review.success.trim());
  const countIdeas = type => state.ideas.filter(i=>i.type===type).length;
  const chosenIdeas = type => state.ideas.filter(i=>i.type===type&&i.selected);
  function loadState(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&x.version===1&&Array.isArray(x.participants)&&Array.isArray(x.ideas)) return normalize(x);}catch(e){}return stateFactory();}
  function normalize(x) {
    const d=stateFactory();
    const participants=d.participants.map(p=>{
      const found=x.participants.find(z=>z&&z.id===p.id);
      if(!found)return p;
      const r=found.review||{};
      return {id:p.id,name:String(found.name||p.name).slice(0,60),nameUpdatedAt:Number(found.nameUpdatedAt)||0,review:{problem:String(r.problem||'').slice(0,6000),success:String(r.success||'').slice(0,6000),problemUpdatedAt:Number(r.problemUpdatedAt)||0,successUpdatedAt:Number(r.successUpdatedAt)||0}};
    });
    const ids=['p1','p2','p3'];
    const ideas=x.ideas.filter(z=>z&&typeof z.id==='string'&&['improve','newbiz'].includes(z.type)).slice(0,2000).map(z=>({
      id:z.id.slice(0,80),type:z.type,title:String(z.title||'').slice(0,200),body:String(z.body||'').slice(0,8000),impact:String(z.impact||'').slice(0,3000),
      need:String(z.need||'').slice(0,6000),benefitCompany:String(z.benefitCompany||'').slice(0,6000),benefitSupplier:String(z.benefitSupplier||'').slice(0,6000),
      feasibility:['high','middle','low','review'].includes(z.feasibility)?z.feasibility:'review',feasibilityReason:String(z.feasibilityReason||'').slice(0,6000),
      execution:String(z.execution||'').slice(0,6000),change:String(z.change||'').slice(0,6000),
      author:ids.includes(z.author)?z.author:'p1',votes:Array.from(new Set((Array.isArray(z.votes)?z.votes:[]).filter(v=>ids.includes(v)))),
      voteChanges:Object.fromEntries(ids.map(id=>[id,{time:Number(z.voteChanges?.[id]?.time)||0,on:z.voteChanges?.[id]?!!z.voteChanges?.[id]?.on:(Array.isArray(z.votes)&&z.votes.includes(id))}])),
      selected:!!z.selected,createdAt:Number(z.createdAt)||0,updatedAt:Number(z.updatedAt)||0
    }));
    const deletedIds=Array.from(new Set((Array.isArray(x.deletedIds)?x.deletedIds:[]).filter(id=>typeof id==='string').slice(-4000)));
    return {version:1,updatedAt:Number(x.updatedAt)||0,participants,ideas:ideas.filter(z=>!deletedIds.includes(z.id)),deletedIds};
  }
  function persist(){state.updatedAt=now();cacheLocal();updateNav();scheduleCloudSave();}
  function cacheLocal(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){toast('저장 공간이 부족합니다. JSON 백업을 내려받으세요.');}}
  function cloudStatus(message,ok){const el=$('#save-status');if(el)el.innerHTML='<span class="dot" style="background:'+(ok?'#15947e':'#c18a42')+'"></span> '+esc(message);}

  function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>el.classList.remove('show'),3000);}
  function viewHead(kicker,title,desc,actions=''){return `<div class="view-head"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><p class="lead">${desc}</p></div>${actions?`<div class="head-actions no-print">${actions}</div>`:''}</div>`;}
  function updateNav(){
    const counts={review:`${state.participants.filter(reviewDone).length}/3`,improve:`${countIdeas('improve')}`,newbiz:`${countIdeas('newbiz')}`};
    $('#nav').innerHTML=order.map((key,i)=>`<button type="button" data-view="${key}" class="${view===key?'active':''}" ${view===key?'aria-current="page"':''}><span class="nav-label-inner"><span class="nav-number">0${i+1}</span>${labels[key]}</span>${counts[key]?`<span class="nav-count">${counts[key]}</span>`:''}</button>`).join('');
    $('#crumb').textContent=labels[view];
  }
  function updateActiveSelect(){ $('#participant').innerHTML=state.participants.map(p=>`<option value="${p.id}" ${p.id===active?'selected':''}>${esc(p.name)}</option>`).join(''); $('#participant').disabled=cloud.connected; }
  function setView(next){ if(!labels[next]) return; view=next;editing=null;render();window.scrollTo({top:0,behavior:'smooth'}); }
  function render(){updateNav();updateActiveSelect();if(view==='dashboard') renderDashboard();else if(view==='review') renderReview();else if(view==='summary') renderSummary();else renderIdeas(view);}
  function statusTag(ok){return ok?'<span class="tag green">작성 완료</span>':'<span class="tag orange">작성 중</span>';}
  function renderDashboard(){
    const done=state.participants.filter(reviewDone).length;
    const ready=done===3&&countIdeas('improve')>=2&&countIdeas('newbiz')>=2;
    $('#content').innerHTML=`
      ${viewHead('WORKSHOP OVERVIEW','2027년 업무 아이디어 취합','2026년 개인별 회고와 2027년 조별 개선·신규사업 아이디어를 한곳에서 정리합니다.','<button class="btn" data-action="export-json">데이터 백업</button><button class="btn primary" data-view="review">작성 시작 →</button>')}
      <section class="hero"><div><strong>${ready?'취합 기준을 모두 채웠습니다.':'의견을 모으고, 방향을 정리하세요.'}</strong><p>참석자 3명 · 개인 Review 각 2항목<br>업무 개선 아이디어 2건 이상 · 신규사업 아이디어 2건 이상</p></div><div class="hero-side"><div class="big">${done}/3</div><div class="small">개인 Review 완료</div></div></section>
      <div class="grid-metrics">
        <div class="metric"><div class="metric-top">2026 개인 Review <span class="metric-icon">R</span></div><div class="metric-number">${done}<small> / 3명</small></div><div class="metric-desc">잘한 점 + 문제점 모두 작성</div></div>
        <div class="metric"><div class="metric-top">2027 업무 개선 <span class="metric-icon">I</span></div><div class="metric-number">${countIdeas('improve')}<small> / 최소 2건</small></div><div class="metric-desc">최종 선정 ${chosenIdeas('improve').length}건</div></div>
        <div class="metric"><div class="metric-top">2027 신규사업 <span class="metric-icon">N</span></div><div class="metric-number">${countIdeas('newbiz')}<small> / 최소 2건</small></div><div class="metric-desc">최종 선정 ${chosenIdeas('newbiz').length}건</div></div>
      </div>
      <div class="two-col">
        <section class="panel"><div class="panel-title-row"><h2>참석자 작성 현황</h2><span class="tag blue">총 3명</span></div>${state.participants.map((p,i)=>`<div class="person-row"><span class="avatar">0${i+1}</span><div><strong>${esc(p.name)}</strong><small>잘한 점 ${p.review.success.trim()?'완료':'미작성'} · 문제점 ${p.review.problem.trim()?'완료':'미작성'}</small></div>${statusTag(reviewDone(p))}</div>`).join('')}<div style="margin-top:14px"><button class="subtle-link" data-view="review">개인별 Review 작성하러 가기 →</button></div></section>
        <section class="panel"><div class="panel-title-row"><h2>작성 순서</h2><span class="tag">가이드</span></div><div class="numlist"><div><span class="stepnum">1</span><div><strong>참석자 이름 변경</strong><p>아래 참석자 설정에서 3명의 이름을 입력합니다.</p></div></div><div><span class="stepnum">2</span><div><strong>개인별 업무 Review</strong><p>우측 상단에서 작성자를 선택하고, 잘한 점과 문제점을 각각 1개 작성합니다.</p></div></div><div><span class="stepnum">3</span><div><strong>조별 아이디어 취합</strong><p>개선·신규사업 아이디어를 각 2건 이상 등록하고 공감 투표로 우선순위를 정합니다.</p></div></div><div><span class="stepnum">4</span><div><strong>최종 선정·결과 공유</strong><p>아이디어를 최종안으로 표시하고 회의 결과를 복사하거나 출력합니다.</p></div></div></div></section>
      </div>
      <section class="panel"><div class="panel-title-row"><h2>참석자 설정</h2><span class="section-note">이름을 수정한 뒤 다른 칸을 클릭하면 저장됩니다.</span></div><div class="name-grid">${state.participants.map((p,i)=>`<div class="field"><label for="name-${p.id}">참석자 ${i+1}</label><input id="name-${p.id}" type="text" data-name-id="${p.id}" maxlength="60" autocomplete="off" value="${esc(p.name)}"></div>`).join('')}</div></section>
      <div class="warning-note" id="save-explainer">${cloud.connected?'저장 방식: 등록된 참여자 3명만 로그인하는 공유 데이터베이스에 저장됩니다. 다른 기기의 변경 내용은 주기적으로 반영됩니다.':'저장 방식: 현재는 이 브라우저에만 저장됩니다. 3명 간 실시간 공유 저장은 데이터베이스 설정 및 이메일 인증이 필요합니다. JSON 백업으로 자료를 옮길 수 있습니다.'} 회사 정보보호 정책상 승인되지 않은 내부·대외비 정보는 입력하지 마세요.</div>
      <div class="footer">2027 TEAM WORKSHOP · 3-PERSON COLLABORATION BOARD</div>`;
  }
  function renderReview(){const p=person(active);$('#content').innerHTML=`
    ${viewHead('01 · PERSONAL REVIEW','2026년 업무 Review','참석자별로 잘한 점 1개, 아쉬웠던 점 또는 문제점 1개를 작성합니다. 입력 내용은 자동 저장됩니다.','<button class="btn" data-view="dashboard">전체 현황 보기</button>')}
    <div class="notice"><strong>현재 작성자: ${esc(p.name)}</strong> · 다른 참석자의 내용을 작성하려면 화면 오른쪽 상단의 작성자 메뉴를 변경하세요.</div>
    <section class="review-card"><span class="review-icon green">GOOD POINT</span><h3>올해 업무에서 잘한 점 1개</h3><p>성과, 시도, 효율 개선, 협업 등 실제로 의미 있었던 내용을 구체적으로 적어주세요.</p><textarea data-review="success" maxlength="6000" placeholder="예) 반복되는 업무 자료 취합을 자동화하여 검토 시간을 줄이고, 부서별 진척 현황을 체계적으로 관리했다.">${esc(p.review.success)}</textarea><div class="review-tools"><span>가능하면 실제 사례 또는 효과를 포함하세요.</span><span id="count-success">${p.review.success.length}자</span></div></section>
    <section class="review-card"><span class="review-icon">IMPROVEMENT POINT</span><h3>올해 업무에서 문제점 1개</h3><p>업무 진행 과정에서 비효율이 있었거나 내년에는 개선이 필요한 부분을 적어주세요.</p><textarea data-review="problem" maxlength="6000" placeholder="예) 업무 담당자 변경과 수작업 확인이 반복되어 진행 상황을 파악하고 후속 조치하는 데 시간이 많이 소요되었다.">${esc(p.review.problem)}</textarea><div class="review-tools"><span>원인과 영향이 드러나도록 작성하면 좋습니다.</span><span id="count-problem">${p.review.problem.length}자</span></div></section>
    <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center"><span class="section-note" id="review-status">${reviewDone(p)?'두 항목을 모두 작성했습니다.':'두 항목 모두 작성하면 개인 Review가 완료됩니다.'}</span><button class="btn primary" data-view="improve">2027년 업무 개선으로 이동 →</button></div>`;
  }
  function bizCriteriaForm(record){
    const val=key=>esc(record?.[key]||'');
    const area=(key,label,placeholder)=>`<div class="field"><label for="biz-${key}">${label} <span style="color:#d34e4e">*</span></label><textarea id="biz-${key}" maxlength="6000" required placeholder="${placeholder}">${val(key)}</textarea></div>`;
    const levels=[['review','검토 필요'],['high','높음'],['middle','보통'],['low','낮음']].map(([v,l])=>`<option value="${v}" ${record?.feasibility===v?'selected':''}>${l}</option>`).join('');
    return `<div class="five-criteria">
      <div class="criteria-card"><div class="criteria-title"><span class="criteria-num">1</span> 필요성</div>${area('need','왜 필요한지','현재의 문제, 추진 배경, 신규 사업이 필요한 이유')}</div>
      <div class="criteria-card"><div class="criteria-title"><span class="criteria-num">2</span> 당사 / 협력사 기여도</div><div class="criteria-subgrid">${area('benefitCompany','당사에 미치는 도움','당사가 얻는 가치 또는 개선 효과')}${area('benefitSupplier','협력사에 미치는 도움','협력사가 얻는 가치 또는 지원 효과')}</div></div>
      <div class="criteria-card"><div class="criteria-title"><span class="criteria-num">3</span> 실행 가능성</div><div class="field"><label for="biz-feasibility">실행 가능성 판단</label><select id="biz-feasibility" required>${levels}</select></div>${area('feasibilityReason','판단 근거','예산·인력·기술·협력체계·예상 장애 요소')}</div>
      <div class="criteria-card"><div class="criteria-title"><span class="criteria-num">4</span> 실행 방안</div>${area('execution','어떻게 실행할 것인지','1단계 시범 운영 → 2단계 확대 적용 등 일정, 주체 및 주요 실행 절차')}</div>
      <div class="criteria-card"><div class="criteria-title"><span class="criteria-num">5</span> 실행 후 변화</div>${area('change','실행하면 무엇이 달라지는지','현재 대비 개선되는 업무 방식, 기대 성과, 확인할 정량 지표')}</div>
    </div>`;
  }
  function ideaForm(type){
    const record=state.ideas.find(i=>i.id===editing&&i.type===type);const isBiz=type==='newbiz';
    return `<section class="panel"><div class="panel-title-row"><h2>${record?'아이디어 수정':'새 아이디어 등록'}</h2><span class="tag blue">작성자: ${esc(authorName(record?record.author:active))}</span></div>
      <form id="idea-form" class="idea-fields"><div class="field"><label for="idea-title">아이디어 제목 <span style="color:#d34e4e">*</span></label><input id="idea-title" type="text" maxlength="200" required placeholder="${isBiz?'예) 협력사 공급망 위험 사전 대응 프로그램':'예) 반복 업무 진척 확인 자동화'}" value="${esc(record?.title||'')}"></div>
      ${isBiz?bizCriteriaForm(record):`<div class="field"><label for="idea-body">현재 문제 및 개선 방법 <span style="color:#d34e4e">*</span></label><textarea id="idea-body" maxlength="8000" required placeholder="현재 어떤 문제가 있고, 무엇을 어떻게 개선할지 적어주세요.">${esc(record?.body||'')}</textarea></div><div class="field"><label for="idea-impact">기대 효과 <span class="hint">(선택)</span></label><textarea id="idea-impact" maxlength="3000" placeholder="업무시간 단축, 비용 절감, 오류 감소 등">${esc(record?.impact||'')}</textarea></div>`}
      <div class="form-actions"><button class="btn primary" type="submit">${record?'수정 완료':'아이디어 등록'}</button>${record?'<button class="btn" type="button" data-action="cancel-edit">수정 취소</button>':''}</div></form></section>`;
  }
  function bizChecklist(i){
    const levels={review:'검토 필요',high:'높음',middle:'보통',low:'낮음'};
    const vals=[['① 필요성',i.need||i.body],['② 당사 기여도',i.benefitCompany],['② 협력사 기여도',i.benefitSupplier],['③ 실행 가능성',levels[i.feasibility]+' · '+(i.feasibilityReason||'미작성')],['④ 실행 방안',i.execution],['⑤ 실행 후 변화',i.change||i.impact]];
    return vals.map(([k,v])=>`<div class="criteria-recap"><b>${esc(k)}</b><span style="white-space:pre-wrap">${esc(nl(v))}</span></div>`).join('');
  }
  function bizChecklistText(i){const levels={review:'검토 필요',high:'높음',middle:'보통',low:'낮음'};return `- ① 필요성: ${nl(i.need||i.body)}\n- ② 당사 기여도: ${nl(i.benefitCompany)}\n- ② 협력사 기여도: ${nl(i.benefitSupplier)}\n- ③ 실행 가능성: ${levels[i.feasibility]} / ${nl(i.feasibilityReason)}\n- ④ 실행 방안: ${nl(i.execution)}\n- ⑤ 실행 후 변화: ${nl(i.change||i.impact)}\n`;}

  function filteredIdeas(type){const list=state.ideas.filter(i=>i.type===type);const filter=ideaFilters[type];return list.filter(i=>filter!=='selected'||i.selected).sort((a,b)=>Number(b.selected)-Number(a.selected)||b.votes.length-a.votes.length||a.createdAt-b.createdAt);}

    [['improve','② 2027년 업무 개선 아이디어'],['newbiz','③ 2027년 신규사업 아이디어']].forEach(([type,title])=>{
      txt+=`${title} (총 ${countIdeas(type)}건 / 최종 ${chosenIdeas(type).length}건)\n\n`;
      const items=state.ideas.filter(i=>i.type===type).sort((a,b)=>Number(b.selected)-Number(a.selected)||b.votes.length-a.votes.length);

  function download(filename,content,mime){const blob=new Blob([content],{type:mime});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);}
  async function copySummary(){const s=summaryText();try{await navigator.clipboard.writeText(s);toast('취합 내용을 클립보드에 복사했습니다.');}catch(e){const el=document.createElement('textarea');el.value=s;el.style.position='fixed';el.style.opacity='0';document.body.appendChild(el);el.select();const ok=document.execCommand('copy');el.remove();toast(ok?'취합 내용을 복사했습니다.':'복사가 제한됩니다. TXT 내려받기를 사용하세요.');}}
  function combined(base,addition){
    const out=normalize(base),incoming=normalize(addition);
    const byId=new Map(out.participants.map(p=>[p.id,p]));
    for(const inc of incoming.participants){const loc=byId.get(inc.id);
      if(inc.nameUpdatedAt>loc.nameUpdatedAt||(loc.name.startsWith('참석자 ')&&!inc.name.startsWith('참석자 '))){loc.name=inc.name;loc.nameUpdatedAt=inc.nameUpdatedAt;}
      for(const f of ['problem','success']){const ts=f+'UpdatedAt';if(inc.review[ts]>loc.review[ts]||(!loc.review[f]&&inc.review[f])){loc.review[f]=inc.review[f];loc.review[ts]=inc.review[ts];}}
    }
    const tomb=new Set([...out.deletedIds,...incoming.deletedIds]);out.deletedIds=[...tomb];
    const map=new Map(out.ideas.map(i=>[i.id,i]));
    for(const inc of incoming.ideas){if(tomb.has(inc.id))continue;
      if(!map.has(inc.id)){map.set(inc.id,inc);continue;}
      const loc=map.get(inc.id);
      const mergedVotes={};
      for(const id of ['p1','p2','p3']){
        const a=loc.voteChanges?.[id]||{time:0,on:loc.votes.includes(id)};
        const b=inc.voteChanges?.[id]||{time:0,on:inc.votes.includes(id)};
        mergedVotes[id]=Number(b.time)>Number(a.time)?b:a;
        if(!Number(a.time)&&!Number(b.time))mergedVotes[id].on=a.on||b.on;
      }
      if(inc.updatedAt>loc.updatedAt)Object.assign(loc,inc);
      loc.voteChanges=mergedVotes;
      loc.votes=Object.entries(mergedVotes).filter(([id,v])=>v.on).map(([id])=>id);
    }
    out.ideas=[...map.values()].filter(i=>!tomb.has(i.id));out.updatedAt=Math.max(out.updatedAt,incoming.updatedAt);
    return normalize(out);
  }
  function merge(imported){state=combined(state,imported);persist();render();}
  function processImport(file){if(!file)return;if(cloud.connected){toast('공유 연결 중에는 백업 파일 병합을 사용할 수 없습니다.');return;}if(file.size>2000000){toast('2MB 이하 JSON 파일만 가져올 수 있습니다.');return;}file.text().then(t=>{let data;try{data=JSON.parse(t);if(!data||data.version!==1||!Array.isArray(data.participants)||!Array.isArray(data.ideas))throw Error('structure');}catch(e){toast('지원하지 않는 JSON 형식입니다.');return;}if(!confirm('가져온 데이터를 현재 내용과 병합할까요?\n기존 내용은 가능한 범위에서 유지하며, 개인별 최신 작성 내용과 새로운 아이디어를 반영합니다.'))return;merge(data);toast('다른 기기에서 작성한 내용을 병합했습니다.');}).catch(()=>toast('파일을 읽을 수 없습니다.'));}

  function scheduleCloudSave(){
    if(!cloud.connected)return;cloud.pending=true;cloudStatus('공유 저장 대기',false);
    clearTimeout(cloud.delay);cloud.delay=setTimeout(flushCloud,900);
  }
  async function readCloudRow(){
    const {data,error}=await cloud.client.from('workshop_states').select('revision,payload').eq('room','team-2027').single();
    if(error)throw error;
    return data;
  }
  async function flushCloud(){
    if(!cloud.connected||cloud.writing||!cloud.pending)return;
    cloud.writing=true;
    try{
      while(cloud.pending){
        cloud.pending=false;
        const localSnapshot=normalize(state);
        let saved=false;
        for(let retry=0;retry<5;retry++){
          const row=await readCloudRow();
          const candidate=combined(row.payload,localSnapshot);
          const {data,error}=await cloud.client.from('workshop_states').update({payload:candidate,revision:row.revision+1,updated_at:new Date().toISOString()}).eq('room','team-2027').eq('revision',row.revision).select('revision');
          if(error)throw error;
          if(data&&data.length){
            cloud.revision=data[0].revision;
            state=combined(candidate,state);
            cacheLocal();cloudStatus('공유 저장 완료',true);
            saved=true;break;
          }
        }
        if(!saved)throw new Error('다른 사용자가 동시에 변경했습니다. 다시 시도합니다.');
      }
    }catch(e){cloudStatus('공유 저장 실패 · 재시도 필요',false);console.error('Cloud save failed',e);cloud.pending=true;
      // Never claim server persistence after a failed network operation.
      toast('공유 저장에 실패했습니다. 인터넷 연결을 확인하고 새로고침 전 JSON 백업을 내려받으세요.');
    }finally{cloud.writing=false;}
  }
  async function pollCloud(){
    if(!cloud.connected||cloud.pending||cloud.writing)return;
    if(document.activeElement&&document.activeElement.matches('input,textarea,select'))return;
    try{const row=await readCloudRow();if(row.revision!==cloud.revision){cloud.revision=row.revision;state=combined(row.payload,state);cacheLocal();render();}}
    catch(e){cloudStatus('연결 확인 필요',false);}
  }
  async function enterCloud(){
    try{
      const {data:{user},error:uerr}=await cloud.client.auth.getUser();if(uerr||!user)return;
      const {data:members,error:merr}=await cloud.client.from('workshop_allowed').select('participant_id').eq('email',user.email.toLowerCase()).limit(1);
      if(merr||!members?.length)throw new Error('허용된 3명의 이메일에 등록되지 않았습니다.');
      cloud.personId=members[0].participant_id;
      const row=await readCloudRow();cloud.revision=row.revision;active=cloud.personId;localStorage.setItem(ACTIVE_KEY,active);
      cloud.connected=true;
      state=combined(row.payload,state);cacheLocal();
      $('#cloud-auth').hidden=true;cloudStatus('공유 저장 연결됨',true);render();
      // Existing local work can be safely merged using per-field timestamps and optimistic version checks.
      cloud.pending=true;await flushCloud();
      setInterval(pollCloud,10000);
    }catch(e){$('#cloud-message').textContent=e.message||'공유 저장 인증에 실패했습니다.';cloudStatus('인증 확인 필요',false);$('#cloud-auth').hidden=false;}
  }

    if(act==='vote'&&i){const on=!i.votes.includes(active);i.votes=on?[...i.votes,active]:i.votes.filter(x=>x!==active);i.voteChanges=i.voteChanges||{};i.voteChanges[active]={time:now(),on};persist();renderIdeas(view);}
    else if(act==='select'&&i){i.selected=!i.selected;i.updatedAt=now();persist();renderIdeas(view);toast(i.selected?'최종안으로 선정했습니다.':'최종안 선정을 해제했습니다.');}
    else if(act==='delete'&&i){if(confirm('이 아이디어와 공감 내역을 삭제할까요?')){state.ideas=state.ideas.filter(x=>x.id!==id);state.deletedIds.push(id);if(editing===id)editing=null;persist();renderIdeas(view);toast('아이디어를 삭제했습니다.');}}
    else if(act==='edit'&&i){editing=id;renderIdeas(view);$('#idea-title')?.focus();window.scrollTo({top:0,behavior:'smooth'});}
    else if(act==='cancel-edit'){editing=null;renderIdeas(view);}
    else if(act==='filter-all'||act==='filter-selected'){ideaFilters[view]=act==='filter-all'?'all':'selected';renderIdeas(view);}
    else if(act==='copy-summary')copySummary();
    else if(act==='export-txt'){download('2027_팀_아이디어_취합.txt',summaryText(),'text/plain;charset=utf-8');toast('TXT 파일을 저장했습니다.');}
    else if(act==='export-json'){download('2027_팀_아이디어_백업.json',JSON.stringify(state,null,2),'application/json;charset=utf-8');toast('JSON 백업 파일을 저장했습니다.');}
    else if(act==='import-json')$('#import-file').click();
    else if(act==='reset'){if(cloud.connected){toast('공유 데이터베이스 연결 중 전체 초기화는 제공하지 않습니다.');return;}if(confirm('참석자 이름과 작성한 모든 내용을 지울까요? 이 작업은 되돌릴 수 없습니다.\n진행 전 JSON 파일로 백업하는 것을 권장합니다.')&&confirm('정말 전체 데이터를 초기화하시겠습니까?')){state=stateFactory();active='p1';localStorage.setItem(ACTIVE_KEY,active);persist();setView('dashboard');toast('모든 내용을 초기화했습니다.');}}
    else if(act==='print'){window.print();}
  });
  $('#import-file').addEventListener('change',e=>{processImport(e.target.files[0]);e.target.value='';});
  window.addEventListener('storage',e=>{if(e.key===KEY){state=loadState();render();toast('다른 탭의 변경 사항을 반영했습니다.');}});
  render();
  initCloud().catch(e=>{cloudStatus('클라우드 설정 오류',false);console.error(e);});
})();
</script>
</body>
</html>
