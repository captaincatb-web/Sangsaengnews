name: Daily Portfolio Briefing to Kakao

on:
  schedule:
    # 매일 07:10 KST = 전날 22:10 UTC (반도체 뉴스 워크플로와 카카오 토큰 갱신이 겹치지 않도록 10분 뒤로 배치)
    - cron: "10 22 * * *"
  workflow_dispatch: {}

jobs:
  send-briefing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Fetch prices/news and send to Kakao
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
        run: python -m src.portfolio_briefing
