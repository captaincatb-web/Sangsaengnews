name: Daily Portfolio Briefing to Kakao

on:
  schedule:
    # 매일 07:10 KST = 전날 22:10 UTC (반도체 뉴스 워크플로와 카카오 토큰 갱신이 겹치지 않도록 10분 뒤로 배치)
    - cron: "10 22 * * *"
  workflow_dispatch: {}

jobs:
  send-briefing:
    runs-on: ubuntu-latest
    env:
      # 카카오 시크릿이 없으면 매일 실패하지 않고 건너뛴다 (Settings > Secrets 에 등록하면 다시 동작)
      HAS_KAKAO: ${{ secrets.KAKAO_REST_API_KEY != '' && secrets.KAKAO_REFRESH_TOKEN != '' }}
    steps:
      - name: Skip notice
        if: ${{ env.HAS_KAKAO != 'true' }}
        run: echo "::warning::KAKAO_REST_API_KEY / KAKAO_REFRESH_TOKEN 시크릿이 없어 건너뜁니다"

      - if: ${{ env.HAS_KAKAO == 'true' }}
        uses: actions/checkout@v4

      - if: ${{ env.HAS_KAKAO == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - if: ${{ env.HAS_KAKAO == 'true' }}
        run: pip install -r requirements.txt

      - name: Fetch prices/news and send to Kakao
        if: ${{ env.HAS_KAKAO == 'true' }}
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
        run: python -m src.portfolio_briefing
