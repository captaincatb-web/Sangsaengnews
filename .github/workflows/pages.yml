name: Company Profile Site to GitHub Pages

on:
  push:
    branches:
      # 배포 브랜치만. 작업 브랜치 푸시가 진행 중인 배포를 취소하지 않게 한다
      - claude/semiconductor-news-kakao-sender-1vfo23
    paths:
      - "site/**"
      - "scripts/build_company_profiles.py"
      - "scripts/build_financials.py"
      - "scripts/dart_documents.py"
      - "scripts/build_peers.py"
      - "scripts/peers_sec.py"
      - "scripts/build_market.py"
      - "scripts/peers_master.csv"
      - "scripts/company_highlights.py"
      - "scripts/build_data_status.py"
      - "scripts/test_site_ui.py"
      - "scripts/update_semi_caps.py"
      - "scripts/build_master.py"
      - "scripts/test_universe_160.py"
      - ".github/workflows/pages.yml"
  schedule:
    # 월~금 23:00 KST = 14:00 UTC: 장 마감 후 그날 종가를 최대한 빨리 반영한다(주가는 평일에만 바뀜).
    - cron: "0 14 * * 1-5"
    # 아침 보조 실행: KRX 당일 자료가 밤 11시에 아직 없었을 때를 대비한 시세 전용 갱신(07:30 KST, 화~토). DART·해외 수집은 하지 않고 저장해 둔 값을 쓴다.
    - cron: "30 22 * * 1-5"
  workflow_dispatch:
    inputs:
      refresh:
        description: "DART 데이터를 새로 수집 (끄면 저장해 둔 데이터로 바로 배포)"
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write   # 시세 갱신이 계속 실패하면 이슈를 만들고, 회복되면 닫는다

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
      # 주요 특징의 뉴스 검색 (없으면 Google 뉴스만 쓴다)
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 화면만 고친 푸시는 저장해 둔 데이터로 바로 배포하고(1~3분),
      # 정기 실행·수동 실행·수집 코드/명단 변경일 때만 DART 를 새로 수집한다(30~40분).
      - name: Decide whether to collect
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          REFRESH: ${{ github.event.inputs.refresh }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          collect=true
          if [ "$SCHEDULE" = "30 22 * * 1-5" ]; then collect=false; fi  # 아침 보조 실행은 시세만
          if [ "$EVENT" = "push" ] && [ -n "$BEFORE" ] && ! echo "$BEFORE" | grep -q '^0*$' && git cat-file -e "$BEFORE" 2>/dev/null; then
            # 해외 비교·시장 정보 수집기는 매번 따로 돌리므로 바뀌어도 DART 전체 수집을 다시 하지 않는다
            changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
            echo "$changed"
            # Only DART collection inputs trigger the expensive full refresh. UI tests and freshness-manifest code do not.
            if ! echo "$changed" | grep -qE '^(scripts/(build_company_profiles|build_financials|dart_documents)\.py|requirements\.txt$|site/data/(companies|universe)\.js$)'; then collect=false; fi
          fi
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$REFRESH" = "false" ]; then collect=false; fi
          echo "collect=$collect" >> "$GITHUB_OUTPUT"
          echo "새로 수집: $collect"

      - name: Restore saved data
        id: restore
        if: ${{ steps.plan.outputs.collect == 'false' }}
        uses: actions/cache/restore@v4
        with:
          path: |
            site/data/profiles.js
            site/data/financials.js
          key: site-data-v2-${{ github.run_id }}
          # 2026-10-31 정기 수집이 OpenDART 접속 오류로 134곳 중 76곳만 저장해 그 캐시(site-data-41156831573)가 최신이 됐다.
          # 새 접두사(v2)로 바꾸고, v2가 없으면 마지막 전체 수집(2026-10-30 정기 실행) 캐시를 쓴다
          restore-keys: |
            site-data-v2-
            site-data-40989705827

      # 저장해 둔 데이터가 없으면 새로 수집한다
      - name: Fall back to collecting
        id: need
        run: |
          if [ "${{ steps.plan.outputs.collect }}" = "true" ] || [ "${{ steps.restore.outputs.cache-matched-key }}" = "" ]; then
            echo "collect=true" >> "$GITHUB_OUTPUT"
          else
            echo "collect=false" >> "$GITHUB_OUTPUT"
            echo "저장된 데이터 사용: ${{ steps.restore.outputs.cache-matched-key }}"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # DART_API_KEY 가 없으면 건너뛰고 기본 정보만 배포한다
      - name: Collect DART profiles
        id: profiles
        if: ${{ env.DART_API_KEY != '' && steps.need.outputs.collect == 'true' }}
        # 수집이 실패해도 사이트는 기본 정보로 배포한다
        continue-on-error: true
        timeout-minutes: 45
        run: python scripts/build_company_profiles.py

      # 협력사 명단 전체의 연간·분기 실적 (성장 분석용). 실패해도 사이트는 배포한다
      - name: Collect financials for analysis
        id: financials
        if: ${{ env.DART_API_KEY != '' && steps.need.outputs.collect == 'true' }}
        continue-on-error: true
        # 351곳 연간·분기·임직원 조회로 40분 안팎 걸린다. 여유를 둔다
        timeout-minutes: 75
        run: python scripts/build_financials.py

      # 둘 다 성공했을 때만 저장한다(실패한 반쪽 데이터가 다음 배포에 쓰이지 않게)
      - name: Save collected data
        if: ${{ steps.profiles.outcome == 'success' && steps.financials.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: |
            site/data/profiles.js
            site/data/financials.js
          key: site-data-v2-${{ github.run_id }}

      # 새로 수집하다 한쪽이 실패하면, 실패한 쪽은 지난번 저장 값으로 되돌린다(기본 틀 파일이 배포되지 않게)
      - name: Keep fresh results before fallback
        if: ${{ steps.need.outputs.collect == 'true' && (steps.profiles.outcome == 'failure' || steps.financials.outcome == 'failure') }}
        run: |
          mkdir -p /tmp/fresh
          [ "${{ steps.profiles.outcome }}" = "success" ] && cp site/data/profiles.js /tmp/fresh/ || true
          [ "${{ steps.financials.outcome }}" = "success" ] && cp site/data/financials.js /tmp/fresh/ || true

      - name: Restore previous data for failed collection
        id: fallback
        if: ${{ steps.need.outputs.collect == 'true' && (steps.profiles.outcome == 'failure' || steps.financials.outcome == 'failure') }}
        uses: actions/cache/restore@v4
        with:
          path: |
            site/data/profiles.js
            site/data/financials.js
          key: site-data-v2-${{ github.run_id }}
          # 2026-10-31 정기 수집이 OpenDART 접속 오류로 134곳 중 76곳만 저장해 그 캐시(site-data-41156831573)가 최신이 됐다.
          # 새 접두사(v2)로 바꾸고, v2가 없으면 마지막 전체 수집(2026-10-30 정기 실행) 캐시를 쓴다
          restore-keys: |
            site-data-v2-
            site-data-40989705827

      - name: Put fresh results back
        if: ${{ steps.need.outputs.collect == 'true' && (steps.profiles.outcome == 'failure' || steps.financials.outcome == 'failure') }}
        run: |
          cp /tmp/fresh/*.js site/data/ 2>/dev/null || true
          echo "이전 값으로 대체: profiles=${{ steps.profiles.outcome }}, financials=${{ steps.financials.outcome }}, 복원 키=${{ steps.fallback.outputs.cache-matched-key }}"

      # 해외 비교 기업(DART·SEC·야후)과 시장 정보(네이버증권).
      # 화면만 고친 푸시는 저장해 둔 값을 그대로 쓰고(수집 12분 절약), 정기 실행·수동 실행·수집 코드 변경일 때만 새로 받는다.
      - name: Decide whether to collect peers and market data
        id: extra_plan
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          run=true
          if [ "$SCHEDULE" = "30 22 * * 1-5" ]; then run=false; fi  # 아침 보조 실행은 시세만
          if [ "$EVENT" = "push" ] && [ -n "$BEFORE" ] && ! echo "$BEFORE" | grep -q '^0*$' && git cat-file -e "$BEFORE" 2>/dev/null; then
            changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
            # Only peer/market collectors and their source lists require a refresh.
            if ! echo "$changed" | grep -qE '^(scripts/(build_peers|peers_sec|build_market)\.py|scripts/peers_master\.csv|requirements\.txt$|site/data/(companies|universe|financials)\.js$)'; then run=false; fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "해외 비교·시장 정보 새로 수집: $run"

      - name: Restore peers and market data
        id: restore-extra
        uses: actions/cache/restore@v4
        with:
          path: |
            site/data/peers.js
            site/data/market.js
          key: extra-data-${{ github.run_id }}
          restore-keys: extra-data-

      # 저장된 값이 없으면 새로 수집한다
      - name: Fall back to collecting peers and market data
        id: extra_need
        run: |
          if [ "${{ steps.extra_plan.outputs.run }}" = "true" ] || [ "${{ steps.restore-extra.outputs.cache-matched-key }}" = "" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "저장된 해외 비교·시장 정보 사용: ${{ steps.restore-extra.outputs.cache-matched-key }}"
          fi

      # 두 수집기는 서로 독립이라 동시에 돌린다(순서대로 돌리면 합쳐서 12분, 동시에 돌리면 긴 쪽만큼 걸린다).
      # 한쪽이 실패해도 사이트는 배포하고, 실패한 쪽은 저장해 둔 이전 값을 쓴다
      - name: Collect overseas peers and market data (parallel)
        id: extra
        if: ${{ env.DART_API_KEY != '' && steps.extra_need.outputs.run == 'true' }}
        timeout-minutes: 30
        run: |
          python scripts/build_peers.py > /tmp/peers.log 2>&1 &
          pid_peers=$!
          python scripts/build_market.py > /tmp/market.log 2>&1 &
          pid_market=$!
          rc_peers=0; rc_market=0
          wait $pid_peers || rc_peers=$?
          wait $pid_market || rc_market=$?
          echo "::group::해외 비교 수집 로그"; cat /tmp/peers.log; echo "::endgroup::"
          echo "::group::시장 정보(네이버증권) 수집 로그"; cat /tmp/market.log; echo "::endgroup::"
          echo "해외 비교 종료 코드 $rc_peers, 시장 정보 종료 코드 $rc_market"
          echo "peers=$([ $rc_peers -eq 0 ] && echo success || echo failure)" >> "$GITHUB_OUTPUT"
          echo "market=$([ $rc_market -eq 0 ] && echo success || echo failure)" >> "$GITHUB_OUTPUT"

      - name: Save peers and market data
        if: ${{ steps.extra.outputs.peers == 'success' || steps.extra.outputs.market == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: |
            site/data/peers.js
            site/data/market.js
          key: extra-data-${{ github.run_id }}

      # 국내 소부장 기업별 시가총액·주가·시장 비중: KRX(키가 있을 때) 또는 네이버로 다시 계산한다.
      # 사이트 배포와 데이터 수집 성공은 다르다: 수집이 실패해도 이전 값으로 배포하지만(continue-on-error) 상태 패널에 '갱신 지연'을 표시하고 이슈로 알린다.
      # 종료 코드 0=성공, 3=거래 시간대라 종가가 아니어서 건너뜀(실패 아님), 그 밖=실패(검증 실패·접속 오류 등, 파일은 바뀌지 않음)
      - name: Update semi caps and market share
        id: caps
        continue-on-error: true
        timeout-minutes: 10
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
        run: |
          set +e
          python scripts/update_semi_caps.py; rc=$?
          if [ $rc -eq 0 ]; then echo "state=success" >> "$GITHUB_OUTPUT"
          elif [ $rc -eq 3 ]; then echo "state=skipped" >> "$GITHUB_OUTPUT"; echo "::notice::시세 갱신을 건너뜀: 거래 시간대라 종가가 아닙니다(이전 값 유지)"; exit 0
          else echo "state=failure" >> "$GITHUB_OUTPUT"; echo "::warning::시세 갱신 실패(종료 코드 $rc): 이전 값으로 배포합니다"; fi
          exit $rc

      - name: Build data freshness manifest
        env:
          CAPS_OUTCOME: ${{ steps.caps.outputs.state || steps.caps.outcome }}
          PROFILE_OUTCOME: ${{ steps.profiles.outcome }}
          FINANCIALS_OUTCOME: ${{ steps.financials.outcome }}
          PEERS_OUTCOME: ${{ steps.extra.outputs.peers }}
          MARKET_OUTCOME: ${{ steps.extra.outputs.market }}
        run: python scripts/build_data_status.py

      # 모집단·집계 무결성 검증: 실패하면 배포를 막는다(가격 값 자체는 검사하지 않고 관계만 확인)
      - name: Validate universe and aggregates
        run: python scripts/test_universe_160.py

      - name: Report price refresh failure (issue)
        if: ${{ steps.caps.outcome == 'failure' && github.event_name != 'pull_request' }}
        uses: actions/github-script@v7
        with:
          script: |
            const title = "[자동] 소부장 시세 갱신 실패";
            const body = `시세 갱신 단계가 실패해 이전 수집 값으로 배포했습니다.\n\n- 실행: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n- 확인: 'Update semi caps and market share' 단계 로그의 [KRX]/[ABORT] 줄\n- 상태 패널에는 '최신 데이터 갱신 지연'으로 표시됩니다.\n\n회복되면 이 이슈는 자동으로 닫힙니다.`;
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: "open", per_page: 50 });
            const found = open.find((i) => i.title === title && !i.pull_request);
            if (found) { await github.rest.issues.createComment({ ...context.repo, issue_number: found.number, body: `다시 실패했습니다: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}` }); }
            else { await github.rest.issues.create({ ...context.repo, title, body }); }

      - name: Close price refresh issue after recovery
        if: ${{ steps.caps.outputs.state == 'success' && github.event_name != 'pull_request' }}
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const title = "[자동] 소부장 시세 갱신 실패";
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: "open", per_page: 50 });
            for (const i of open.filter((x) => x.title === title && !x.pull_request)) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: i.number, body: "시세 갱신이 회복되어 닫습니다." });
              await github.rest.issues.update({ ...context.repo, issue_number: i.number, state: "closed", state_reason: "completed" });
            }

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate regional map before publishing
        run: |
          node --check site/dashboard-map-utils.js
          node --check site/dashboard-map.js
          node --check site/dashboard.js
          node --test tests/regional-map.test.cjs

      - name: Validate site structure and navigation
        run: python scripts/test_site_ui.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
