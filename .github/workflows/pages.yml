name: Company Profile Site to GitHub Pages

on:
  push:
    branches:
      - claude/semiconductor-news-kakao-sender-1vfo23
      - claude/adoring-mendel-tqejsu
    paths:
      - "site/**"
      - "scripts/build_company_profiles.py"
      - "scripts/build_financials.py"
      - "scripts/dart_documents.py"
      - "scripts/company_highlights.py"
      - ".github/workflows/pages.yml"
  schedule:
    # 매일 07:30 KST = 전날 22:30 UTC (DART 데이터·주가 갱신)
    - cron: "30 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
      # 주요 특징의 뉴스 검색 (없으면 Google 뉴스만 쓴다)
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      # DART_API_KEY 가 없으면 건너뛰고 기본 정보만 배포한다
      - name: Collect DART profiles
        if: ${{ env.DART_API_KEY != '' }}
        # 수집이 실패해도 사이트는 기본 정보로 배포한다
        continue-on-error: true
        timeout-minutes: 45
        run: python scripts/build_company_profiles.py

      # 협력사 명단 전체의 연간·분기 실적 (성장 분석용). 실패해도 사이트는 배포한다
      - name: Collect financials for analysis
        if: ${{ env.DART_API_KEY != '' }}
        continue-on-error: true
        timeout-minutes: 45
        run: python scripts/build_financials.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
