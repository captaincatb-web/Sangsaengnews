name: semi-count

# DART 로 국내 상장사 전체를 훑어 반도체 소부장(소재·부품·장비) 숫자를 센다(수동 실행). 결과는 로그의 [semi-count-json] 줄과 artifact.
on:
  workflow_dispatch:

jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 175
    env:
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
      DART_BUDGET_SEC: "9000"  # 모집단 확보: 상장사 전체를 끝까지 받는다(최대 150분, 저장해 둔 값은 건너뜀)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - uses: actions/cache@v4
        with:
          path: semi_det.json
          key: semi-det-${{ github.run_id }}
          restore-keys: semi-det-
      - run: python scripts/count_listed_semi.py
      - uses: actions/upload-artifact@v4
        with:
          name: semi-count
          path: semi_count.json
