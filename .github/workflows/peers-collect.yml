name: peers-collect

# 해외·대형 비교 기업 수집 시험용(수동 실행). 결과는 로그의 [peers-json] 줄과 artifact 로 회수한다.
on:
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Collect peers
        working-directory: scripts
        run: python build_peers.py
      - uses: actions/upload-artifact@v4
        with:
          name: peers
          path: site/data/peers.js
