name: Daily Semiconductor SME News to Kakao

on:
  schedule:
    # 매일 07:00 KST = 전날 22:00 UTC
    - cron: "0 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  send-news:
    runs-on: ubuntu-latest
    env:
      # 카카오 시크릿이 없으면 매일 실패하지 않고 건너뛴다 (Settings > Secrets 에 등록하면 다시 동작)
      HAS_KAKAO: ${{ secrets.KAKAO_REST_API_KEY != '' && secrets.KAKAO_REFRESH_TOKEN != '' }}
    steps:
      - name: Skip notice
        if: ${{ env.HAS_KAKAO != 'true' }}
        run: echo "::warning::KAKAO_REST_API_KEY / KAKAO_REFRESH_TOKEN 시크릿이 없어 건너뜁니다"

      - if: ${{ env.HAS_KAKAO == 'true' }}
        uses: actions/checkout@v4

      - if: ${{ env.HAS_KAKAO == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - if: ${{ env.HAS_KAKAO == 'true' }}
        run: pip install -r requirements.txt

      - name: Collect news and send to Kakao
        if: ${{ env.HAS_KAKAO == 'true' }}
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
        run: python -m src.main

      - name: Commit updated history
        if: ${{ env.HAS_KAKAO == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/sent_history.json
          git diff --cached --quiet || git commit -m "chore: update sent news history"
          git push
