name: edinet-japan-unit-tests

on:
  pull_request:
    paths:
      - "scripts/peers_edinet.py"
      - "tests/test_peers_edinet.py"
      - ".github/workflows/edinet-japan-pilot.yml"
      - ".github/workflows/edinet-japan-unit-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "requests>=2.31"
      - run: python -m unittest discover -s tests -p "test_peers_edinet.py" -v
