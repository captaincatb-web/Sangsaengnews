name: semi-verify

# 후보 기업의 사업보고서 '사업의 내용'을 읽어 반도체 소부장 관련성을 점검한다(수동 실행). 결과는 artifact semi_verify.csv 와 로그 [verify-row] 줄.
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
      VERIFY_BUDGET_SEC: "6000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - uses: actions/cache@v4
        with:
          path: semi_verify_cache.json
          key: semi-verify-${{ github.run_id }}
          restore-keys: semi-verify-
      - run: python scripts/semi_verify.py
      - uses: actions/upload-artifact@v4
        with:
          name: semi-verify
          path: semi_verify.csv
